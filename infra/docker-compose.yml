name: laundry

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-laundry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-laundry}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-laundry} -d ${POSTGRES_DB:-laundry}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-laundry}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-laundry}
      SESSION_SECRET: ${SESSION_SECRET:?set in .env}
      WEB_ORIGIN: https://laundry.filippmiller.com
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-fake}
      FISCAL_PROVIDER: ${FISCAL_PROVIDER:-stub}
      LOG_LEVEL: warn
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "node ./node_modules/drizzle-kit/bin.cjs migrate && npm run dev:api"

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-laundry}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-laundry}
      WORKER_INTERVAL_MS: 30000
    depends_on:
      db:
        condition: service_healthy
    command: npm run worker

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
