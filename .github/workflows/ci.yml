name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # The integration suite (authorization negatives, money invariants, custody, outbox) needs a
    # real PostgreSQL. Without a database TEST_DATABASE_URL is unset and every
    # `describe.skipIf(!process.env.TEST_DATABASE_URL)` block is SKIPPED — a green job that
    # proved nothing. The service below makes those tests actually run.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: laundry
          POSTGRES_PASSWORD: laundry_test_only
          POSTGRES_DB: laundry_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U laundry -d laundry_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://laundry:laundry_test_only@127.0.0.1:5432/laundry_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Repo hygiene guard
        run: npm run guard:hygiene
      - run: npm run lint
      - run: npm run typecheck
      - name: Test suite (unit + integration against PostgreSQL)
        run: npm test
      - run: npm run web:build
      - run: npm audit --omit=dev
      - name: Migration drift check
        run: |
          npm run db:generate
          git diff --exit-code -- drizzle || (echo "Generated migrations are not checked in" && exit 1)
      - name: Backup and restore drill (pg_dump/pg_restore)
        env:
          DRILL_DATABASE_URL: postgres://laundry:laundry_test_only@127.0.0.1:5432/laundry_test
          DRILL_REQUIRE_PG_DUMP: "true"
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16
          npm run db:drill

  smoke:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: laundry
          POSTGRES_PASSWORD: laundry_test_only
          POSTGRES_DB: laundry
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U laundry -d laundry"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://laundry:laundry_test_only@127.0.0.1:5432/laundry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run web:build
      - name: Start API with disposable PostgreSQL
        run: |
          npm run db:migrate
          npm run start:api > /tmp/laundry-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/v1/health > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "API did not start" && exit 1
      - name: Smoke test
        run: npm run smoke
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000
      - name: Wave 7 live verification (the script starts the server it checks)
        run: npm run verify:wave7
        env:
          VERIFY_SPAWN_API: "1"
          VERIFY_API_PORT: "3107"
      - name: Wave 8 live verification (the script starts the server it checks)
        run: npm run verify:wave8
        env:
          VERIFY_SPAWN_API: "1"
          VERIFY_API_PORT: "3126"
      - name: Wave 8 browser acceptance (the script starts the stand it checks)
        run: npm run verify:wave8:ui
        env:
          VERIFY_SPAWN_APP: "1"
          VERIFY_API_PORT: "3127"
      - name: Mobile layout regression (16 combinations of viewport, zoom and role)
        run: npm run verify:mobile
        env:
          APP_URL: http://127.0.0.1:3000
      - name: Write CI provenance summary
        if: always()
        run: |
          mkdir -p temp/ci-artifacts
          node -e '
            const fs = require("node:fs");
            const { execFileSync } = require("node:child_process");
            const git = args => execFileSync("git", args, { encoding: "utf8" }).trim();
            const provenance = {
              generatedAt: new Date().toISOString(),
              runId: process.env.GITHUB_RUN_ID ?? null,
              runAttempt: process.env.GITHUB_RUN_ATTEMPT ?? null,
              githubSha: process.env.GITHUB_SHA ?? null,
              githubRef: process.env.GITHUB_REF ?? null,
              headRef: process.env.GITHUB_HEAD_REF ?? null,
              checkoutSha: git(["rev-parse", "HEAD"]),
              checkoutTree: git(["rev-parse", "HEAD^{tree}"]),
            };
            fs.writeFileSync("temp/ci-artifacts/ci-provenance.json", JSON.stringify(provenance, null, 2) + "\n");
          '
      - name: Upload verification receipts and mobile measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-verification-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            temp/ci-artifacts/ci-provenance.json
            docs/evidence/wave7/
            docs/evidence/wave8/
            temp/audit-shots/mobile-fix/measurements.json
      - name: API log
        if: failure()
        run: cat /tmp/laundry-api.log

