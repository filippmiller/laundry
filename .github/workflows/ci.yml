name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:generate
      - name: Check generated migrations
        run: test -n "$(find drizzle -maxdepth 1 -name '*.sql' -print -quit)"
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: laundry
          POSTGRES_PASSWORD: laundry_test_only
          POSTGRES_DB: laundry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U laundry -d laundry_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://laundry:laundry_test_only@localhost:5432/laundry_test
      TEST_DATABASE_URL: postgres://laundry:laundry_test_only@localhost:5432/laundry_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npx vitest run test/slot-postgres.integration.test.ts
